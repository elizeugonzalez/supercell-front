<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service 4.0 - Orçamento Imediato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      text-align: center;
    }

    header {
      padding: 20px 10px 10px;
    }

    .logoEG {
      width: 80px;
      margin-bottom: 10px;
    }

    .titulo {
      font-weight: bold;
      font-size: 28px;
      margin: 0;
    }

    .subtitulo {
      font-size: 13px;
      color: #666;
    }

    .main {
      margin-top: 30px;
    }

    .principal {
      font-size: 32px;
      font-weight: bold;
    }

    .descricao {
      font-size: 18px;
      color: #555;
    }

    .cta-button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }

    .devices {
      margin-top: 40px;
    }

    .devices img {
      max-width: 180px;
      margin: 0 10px;
    }

    .powered {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }

    .powered img {
      width: 100px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <img src="cel.png" alt="Logo EG" class="logoEG" />
    <h1 class="titulo">SERVICE 4.0</h1>
    <p class="subtitulo">ONDE O FUTURO E O PRESENTE SE ENCONTRAM COM INTELIGÊNCIA REAL</p>
  </header>

  <div class="main">
    <p class="principal">Seu orçamento<br>imediato</p>
    <p class="descricao">com a tecnologia do futuro</p>
    <a href="#" class="cta-button">OBTER UM ORÇAMENTO</a>

    <div class="devices">
      <img src="cel.png" alt="iPhone" />
      <img src="tablet.png" alt="iPad" />
    </div>

    <div class="powered">
      Powered by<br />
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/OpenAI_Logo.svg" alt="OpenAI logo" />
    </div>
  </div>

</body>
</html>
